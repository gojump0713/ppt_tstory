<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<title>OG card</title>
<style>
@font-face{font-family:"Pretendard";src:url("../fonts/PretendardVariable.woff2") format("woff2-variations");font-weight:45 920;font-style:normal;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0B1018}
.card{position:relative;width:1200px;height:630px;font-family:"Pretendard",system-ui,sans-serif;overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
/* 상단은 글자가 읽히도록 어둡게, 하단 책·빛은 살린다 */
.scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(9,13,20,.86) 0%,rgba(9,13,20,.76) 28%,rgba(9,13,20,.46) 50%,rgba(9,13,20,.10) 70%,rgba(9,13,20,0) 86%),
  radial-gradient(58% 42% at 50% 92%,rgba(255,196,110,.30),transparent 70%)}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:46px 80px 0}
.badge{width:74px;height:74px;border-radius:50%;background:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 10px rgba(255,255,255,.13),0 14px 40px rgba(231,167,78,.45)}
.badge svg{width:40px;height:40px;fill:none;stroke:#5C6CFF;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{margin-top:22px;font-size:23px;font-weight:700;letter-spacing:.24em;color:#F3D9AC;text-shadow:0 2px 12px rgba(0,0,0,.55)}
h1{margin-top:16px;font-size:74px;line-height:1.17;font-weight:800;color:#fff;text-align:center;letter-spacing:-.022em;
  text-shadow:0 4px 26px rgba(0,0,0,.62),0 1px 3px rgba(0,0,0,.5)}
h1 .l2{color:#fff}
.sub{margin-top:18px;font-size:26px;font-weight:600;line-height:1.5;color:rgba(255,255,255,.93);text-align:center;
  text-shadow:0 2px 16px rgba(0,0,0,.7)}
.chips{margin-top:26px;display:flex;gap:12px}
.chip{display:flex;align-items:center;gap:9px;padding:11px 20px;border-radius:999px;background:rgba(255,255,255,.94);
  font-size:20px;font-weight:700;color:#15202B;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.chip svg{width:20px;height:20px;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.c1 svg{stroke:#5C6CFF}.c2 svg{stroke:#E7A74E}.c3 svg{stroke:#3F9B74}
</style></head><body>
<div class="card">
  <img class="bg" src="../media/s17_closing_origin_of_imagination.jpg" alt="">
  <div class="scrim"></div>
  <div class="inner">
    <div class="badge"><svg viewBox="0 0 48 48"><path d="M8 10c5-2 10-2 16 1 6-3 11-3 16-1v28c-5-2-10-2-16 1-6-3-11-3-16-1z"/><path d="M24 11v28"/></svg></div>
    <div class="eyebrow">공공도서관 도입 제안</div>
    <h1>전 세대를 잇는<br><span class="l2">AI동화책 제작 플랫폼</span></h1>
    <div class="sub">아이의 상상, 직장인의 일상, 어르신의 기억이 한 권의 책이 됩니다.</div>
  </div>
</div>
</body></html>
